name: Deploy public demo

# Builds the backend-free demo bundle (`npm run build:demo`, see frontend/.env.demo and
# frontend/src/config.ts) and publishes it to GitHub Pages. Only frontend/public/demo-cache/
# ships -- a small, git-tracked set of songs the repo owner has cleared for public
# redistribution -- never the .gitignored frontend/public/cache/ that accumulates whatever's
# been processed locally.
#
# Auto-deploy is disabled: the demo-cache catalog is currently empty (no vetted song), so
# there's nothing worth publishing. Run manually via workflow_dispatch once a demo song/video
# is ready.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
